name: RailWatch deployment verification

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '8,38 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: railwatch-deploy-verify
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Render deployment
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Wait for Render to serve this commit
        env:
          RAILWATCH_API_URL: https://naha-railwatch-api.onrender.com
          EXPECTED_RENDER_COMMIT: ${{ github.sha }}
          RAILWATCH_MONITOR_TIMEOUT_MS: 15000
        run: |
          for attempt in $(seq 1 36); do
            echo "Deployment check $attempt/36"
            if npm run railwatch:monitor; then
              exit 0
            fi
            if [ "$attempt" -lt 36 ]; then
              echo "Render is not ready yet; retrying in 20 seconds."
              sleep 20
            fi
          done
          echo "Render did not become healthy on the expected commit within 12 minutes."
          exit 1

      - name: Exercise live production API with bounded recovery
        env:
          RAILWATCH_API_URL: https://naha-railwatch-api.onrender.com
        run: |
          for attempt in 1 2; do
            echo "Production smoke attempt $attempt/2"
            if npm run railwatch:production-smoke; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "Production smoke failed transiently; retrying in 5 seconds."
              sleep 5
            fi
          done
          echo "Production smoke failed after bounded recovery."
          exit 1

      - name: Close stale deployment alert after recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="RailWatch deployment verification alert"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "✅ Deployment verification recovered on commit $GITHUB_SHA. Render health and production smoke passed."
            gh issue close "$EXISTING"
          fi

      - name: Raise persistent GitHub alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="RailWatch deployment verification alert"
          BODY="## RailWatch deployment verification failed\n\n- Workflow: $GITHUB_WORKFLOW\n- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n- Commit expected: $GITHUB_SHA\n- Time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')\n\nRender did not pass deployment verification after bounded recovery. Check whether the service is unhealthy, stale, or failing the production API smoke test."
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
