name: RailWatch Render monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: railwatch-monitor
  cancel-in-progress: true

jobs:
  health:
    name: Render health + deployment fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Prove the monitor catches synthetic drift
        run: npm run railwatch:monitor:selftest

      - name: Probe Render service
        id: probe
        env:
          RAILWATCH_API_URL: https://naha-railwatch-api.onrender.com
          EXPECTED_RENDER_COMMIT: ${{ github.sha }}
        run: npm run railwatch:monitor

      - name: Close recovered monitor alert
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXISTING=$(gh issue list --state open --search "RailWatch monitor alert in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "✅ Recovery confirmed by automated monitor on commit $GITHUB_SHA at $(date -u '+%Y-%m-%d %H:%M:%S') UTC."
            gh issue close "$EXISTING" --reason completed
          fi

      - name: Raise persistent GitHub alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="RailWatch monitor alert"
          BODY="## RailWatch monitor failure\n\n- Workflow: $GITHUB_WORKFLOW\n- Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\n- Commit checked: $GITHUB_SHA\n- Time (UTC): $(date -u '+%Y-%m-%d %H:%M:%S')\n\nThe scheduled health/fingerprint monitor failed. Inspect the workflow logs before closing this alert."
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
