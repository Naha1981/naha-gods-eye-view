name: RailWatch Render monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

permissions:
  contents: read

env:
  RAILWATCH_API_URL: https://naha-railwatch-api.onrender.com

concurrency:
  group: railwatch-monitor
  cancel-in-progress: true

jobs:
  health:
    name: Render health + deployment fingerprint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Prove the monitor catches synthetic drift
        run: npm run railwatch:monitor:selftest

      - name: Probe Render service
        id: probe
        env:
          EXPECTED_RENDER_COMMIT: ${{ github.sha }}
        run: npm run railwatch:monitor

      - name: Write monitor summary
        if: always()
        run: |
          {
            echo "## RailWatch monitor"
            echo "- Expected commit: \\`${GITHUB_SHA}\\`"
            echo "- API: ${RAILWATCH_API_URL}"
            echo "- Result: ${{ steps.probe.outcome || 'not executed' }}"
          } >> "$GITHUB_STEP_SUMMARY"
